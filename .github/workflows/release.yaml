name: Release

on:
  workflow_dispatch:
    inputs:
      fuse_version:
        description: 'libfuse version to build (e.g. 3.18.2)'
        type: string
        required: true
        default: '3.18.2' # renovate: libfuse
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # create release + upload assets
  packages: write   # push to GHCR

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - id: resolve
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            ref="${GITHUB_REF#refs/tags/v}"
            echo "version=${ref}" >>"$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.fuse_version }}" >>"$GITHUB_OUTPUT"
          fi
          # GHCR requires lowercase repository names; the GitHub owner login
          # is case-preserving, so we explicitly lowercase it here.
          owner_lc="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "owner_lc=${owner_lc}" >>"$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            FUSE_VERSION=${{ steps.resolve.outputs.version }}
          tags: |
            ghcr.io/${{ steps.resolve.outputs.owner_lc }}/fusermount3-static:${{ steps.resolve.outputs.version }}
            ghcr.io/${{ steps.resolve.outputs.owner_lc }}/fusermount3-static:latest
          push: true

      - name: Extract per-arch binaries
        run: |
          set -euxo pipefail
          version="${{ steps.resolve.outputs.version }}"
          image="ghcr.io/${{ steps.resolve.outputs.owner_lc }}/fusermount3-static:${version}"
          mkdir -p dist
          for arch in amd64 arm64; do
            cid="$(docker create --platform "linux/${arch}" "${image}")"
            docker cp "${cid}:/fusermount3" "dist/fusermount3-${version}-linux-${arch}"
            docker rm "${cid}" >/dev/null
          done

      - name: Bundle libfuse source (GPL-2.0 compliance)
        run: |
          set -euxo pipefail
          version="${{ steps.resolve.outputs.version }}"
          curl -fsSL -o "dist/libfuse-${version}.tar.gz" \
            "https://github.com/libfuse/libfuse/releases/download/fuse-${version}/fuse-${version}.tar.gz"

      - name: Compute SHA256SUMS
        run: |
          set -euxo pipefail
          cd dist
          sha256sum * >SHA256SUMS
          cat SHA256SUMS

      - name: Create / update release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.resolve.outputs.version }}
          files: |
            dist/fusermount3-${{ steps.resolve.outputs.version }}-linux-amd64
            dist/fusermount3-${{ steps.resolve.outputs.version }}-linux-arm64
            dist/libfuse-${{ steps.resolve.outputs.version }}.tar.gz
            dist/SHA256SUMS

      - name: Upload artifacts (dispatch runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: fusermount3-${{ steps.resolve.outputs.version }}
          path: dist/
